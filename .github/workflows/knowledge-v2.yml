name: Knowledge workspace manual acceptance
# Manual specialist checks of CURRENT app, not the removed V1 DOM; app-review.yml is the PR gate.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kc2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node tests/knowledge-regression.cjs
          node tests/knowledge-v2-core.cjs
          node tests/knowledge-v2-safety.cjs
          node tests/storage-safety.cjs
          node tests/storage-lock-native.cjs
          node tests/fitness-regression.cjs
          node tests/trash-regression.cjs
          node tests/pin-forest-regression.cjs
          node tests/pin-disabled-regression.cjs
          node --check assets/memento-knowledge.js
          node --check assets/memento-knowledge-core.js
          node --check sw.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        width: [360, 393, 412, 1280]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated test browser
        run: |
          npm install --prefix "$RUNNER_TEMP/memento-browser" --no-package-lock --no-save playwright@1.62.1
          "$RUNNER_TEMP/memento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/memento-browser/node_modules" >> "$GITHUB_ENV"
      - name: Build private-in-run synthetic visual fixture
        run: node tests/helpers/visual-fixture.cjs > "$RUNNER_TEMP/kc2-fixture.json"
      - name: Current knowledge workspace, editor, interactions and geometry
        env:
          MEMENTO_VISUAL_WIDTH: ${{ matrix.width }}
          MEMENTO_VISUAL_FIXTURE: ${{ runner.temp }}/kc2-fixture.json
        run: node tests/knowledge-workspace-browser.cjs
      - name: Keep actual current knowledge screenshots even on green
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-current-${{ matrix.width }}
          path: /tmp/memento-workspace-visual/after/${{ matrix.width }}
          if-no-files-found: error
          retention-days: 7
  original-storage-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --prefix "$RUNNER_TEMP/memento-browser" --no-package-lock --no-save playwright@1.62.1
          "$RUNNER_TEMP/memento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/memento-browser/node_modules" >> "$GITHUB_ENV"
      - run: node tests/storage-safety-browser.cjs
  known-general-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/memento-regression.cjs
  known-fitness-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --prefix "$RUNNER_TEMP/memento-browser" --no-package-lock --no-save playwright@1.62.1
          "$RUNNER_TEMP/memento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/memento-browser/node_modules" >> "$GITHUB_ENV"
      - run: node tests/fitness-browser.cjs
  published-pages:
    if: github.ref == 'refs/heads/main'
    needs: [core-and-safety, browser, original-storage-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify public Pages bytes match this exact commit
        run: node tests/knowledge-v2-publication.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: kc2-publication-evidence
          path: /tmp/kc2-publication.json
