name: Memento illustrated icons
on:
  push:
    paths: ["assets/memento-illustrative-icons.js", "assets/memento-illustrative-icons.css", "assets/memento-knowledge.js", "assets/memento-fitness.js", "index.html", "sw.js", "docs/icon-audit.html", "tests/illustrative-icons*.cjs", ".github/workflows/illustrative-icons.yml"]
  pull_request:
    paths: ["assets/memento-illustrative-icons.js", "assets/memento-illustrative-icons.css", "assets/memento-knowledge.js", "assets/memento-fitness.js", "index.html", "sw.js", "docs/icon-audit.html", "tests/illustrative-icons*.cjs", ".github/workflows/illustrative-icons.yml"]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check assets/memento-illustrative-icons.js
          node --check assets/memento-knowledge.js
          node --check assets/memento-fitness.js
          node --check sw.js
          node tests/illustrative-icons-core.cjs
          node tests/knowledge-covers.cjs
          node tests/knowledge-regression.cjs
          node tests/fitness-regression.cjs
          node tests/storage-safety.cjs
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        width: [360, 393, 412]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/memento-browser" --no-package-lock --no-save playwright@1.62.1
          "$RUNNER_TEMP/memento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/memento-browser/node_modules" >> "$GITHUB_ENV"
      - name: Inspect all icons and mobile journeys
        env:
          ILLUSTRATIVE_WIDTH: ${{ matrix.width }}
          ILLUSTRATIVE_SCREENSHOT_DIR: ${{ runner.temp }}/illustrative-icons
        run: node tests/illustrative-icons-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: illustrated-icons-${{ matrix.width }}
          path: ${{ runner.temp }}/illustrative-icons
