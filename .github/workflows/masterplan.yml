name: Memento historical upgrade and masterplan acceptance
# Manual only. Current PR/full-run safety is handled by app-review.yml.
# Original V1 journeys remain in tests/ as historical references, not runnable acceptance.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Existing data, finance, notes, fitness and PIN contracts
        run: |
          node tests/memento-category-integrity.cjs
          node tests/memento-regression.cjs
          node tests/masterplan-core.cjs
          node tests/storage-safety.cjs
          node tests/storage-lock-native.cjs
          node tests/service-worker-cache.cjs
          node tests/knowledge-regression.cjs
          node tests/knowledge-v2-core.cjs
          node tests/knowledge-v2-safety.cjs
          node tests/journal-upgrade-core.cjs
          node tests/fitness-regression.cjs
          node tests/trash-regression.cjs
          node tests/pin-disabled-regression.cjs
          node tests/illustrative-icons-core.cjs
      - name: Isolated Chromium outside production source
        run: |
          npm install --prefix "$RUNNER_TEMP/memento-browser" --no-package-lock --no-save playwright@1.62.1
          "$RUNNER_TEMP/memento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/memento-browser/node_modules" >> "$GITHUB_ENV"
      - name: Modern Masterplan journeys (tasks, diary, knowledge, finance, day)
        run: |
          node tests/ci-groups.cjs life-knowledge high
          node tests/taken-v4-browser.cjs
          node tests/day-v3-browser.cjs
          node tests/memento-category-browser.cjs
          node tests/app-review-browser.cjs
      - name: Immutable last pre-F0 PWA baseline (v119)
        run: |
          BASE=248a5dd811b90b293aebda134e67c32338563e86
          git fetch --depth=1 origin "$BASE"
          mkdir -p "$RUNNER_TEMP/memento-baseline"
          git archive "$BASE" | tar -x -C "$RUNNER_TEMP/memento-baseline"
          echo "MEMENTO_RECOVERY_BASELINE_ROOT=$RUNNER_TEMP/memento-baseline" >> "$GITHUB_ENV"
          echo "MEMENTO_RECOVERY_BASELINE_SHA=$BASE" >> "$GITHUB_ENV"
      - name: Real worker and offline upgrade, preserving IDs, PIN, finances and binary attachments
        run: node tests/recovery-upgrade-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: masterplan-current-and-upgrade-evidence
          path: |
            /tmp/memento-workspace-visual/after
            /tmp/memento-taken-v4/after
            /tmp/memento-recovery-upgrade
          if-no-files-found: warn
          retention-days: 7
