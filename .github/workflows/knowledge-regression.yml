name: Knowledge, backup and PIN forest regression
# Manual specialist suites; automated checks are consolidated in app-review.yml.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  knowledge-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test migration, revision, attachment and full ZIP integrity
        run: |
          node tests/knowledge-regression.cjs
          node tests/trash-regression.cjs
      - name: Validate browser JavaScript syntax
        run: |
          node --check assets/memento-knowledge-core.js
          node --check assets/memento-knowledge-store.js
          node --check assets/memento-knowledge.js
          node --check assets/memento-backup.js
          node --check assets/memento-trash-core.js
          node --check tests/trash-regression.cjs

  pin-forests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate hourly forest rotation and weather integration
        run: |
          node tests/pin-forest-regression.cjs
          node tests/pin-disabled-regression.cjs
          node --check assets/memento-forest-art.js
          node --check assets/memento-forest-lock.js
          node --check sw.js
