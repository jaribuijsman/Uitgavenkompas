name: Memento journal sleep and recording acceptance
on:
  push:
    branches: [main, work/memento-journal-sleep-voice-ai-20261027]
    paths:
      - 'assets/memento-knowledge-core.js'
      - 'assets/memento-knowledge-store.js'
      - 'assets/memento-dictation.js'
      - 'assets/memento-dictation.css'
      - 'assets/memento-fitness.js'
      - 'tests/dictation-regression.cjs'
      - 'assets/memento-knowledge.js'
      - 'assets/memento-knowledge.css'
      - 'index.html'
      - 'sw.js'
      - 'tests/journal-upgrade-*.cjs'
      - 'tests/journal-selfcare-*.cjs'
      - '.github/workflows/journal-upgrade.yml'
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check assets/memento-dictation.js
          node --check assets/memento-fitness.js
          node tests/dictation-regression.cjs
          node --check assets/memento-knowledge.js
          node --check assets/memento-knowledge-core.js
          node --check assets/memento-knowledge-store.js
          node --check sw.js
          node tests/journal-upgrade-core.cjs
          node tests/journal-selfcare-core.cjs
          node tests/knowledge-regression.cjs
          node tests/knowledge-v2-core.cjs
          node tests/knowledge-v2-safety.cjs
          node tests/storage-safety.cjs
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        width: [360, 393, 412]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --prefix "$RUNNER_TEMP/memento-browser" --no-package-lock --no-save playwright@1.62.1
          "$RUNNER_TEMP/memento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/memento-browser/node_modules" >> "$GITHUB_ENV"
      - name: Check diary, audio and Android app handoff
        env:
          JOURNAL_WIDTH: ${{ matrix.width }}
          JOURNAL_SHOT_DIR: ${{ runner.temp }}/diary-review
        run: |
          node tests/journal-upgrade-browser.cjs
          node tests/journal-selfcare-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-review-${{ matrix.width }}
          path: ${{ runner.temp }}/diary-review
