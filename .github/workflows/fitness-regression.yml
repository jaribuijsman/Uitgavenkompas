name: Fitness regression

# Manual specialist suites; automated checks are consolidated in app-review.yml.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  fitness-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fitness regression checks
        run: node tests/fitness-regression.cjs
