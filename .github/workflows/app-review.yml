name: Memento complete glass review

on:
  pull_request:
    branches: [main]
    paths: ['index.html', 'sw.js', 'assets/**', 'tests/**', '.github/workflows/**', 'AGENTS.md']
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'assets/**', 'tests/**', '.github/workflows/**', 'AGENTS.md']
  workflow_dispatch:

permissions:
  contents: read

# Cancel only obsolete PR runs; keep deployments and main runs.
concurrency:
  group: memento-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.select.outputs.tier }}
      groups: ${{ steps.select.outputs.groups }}
      upgrade: ${{ steps.select.outputs.upgrade }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Choose coverage from changed files
        id: select
        env:
          MEMENTO_CI_FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' }}
          MEMENTO_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tests/ci-plan.cjs

  core:
    needs: plan
    if: needs.plan.outputs.tier != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Current-version contracts and data safety
        run: |
          set -e
          node --check tests/ci-plan.cjs
          node --check tests/ci-groups.cjs
          node tests/ci-plan-regression.cjs
          node tests/service-worker-cache.cjs
          if [ "${{ needs.plan.outputs.tier }}" = "low" ]; then exit 0; fi
          node --check assets/memento-assistant.js
          node --check assets/memento-assistant-core.js
          node --check sw.js
          node tests/memento-assistant-core.cjs
          node tests/storage-safety.cjs
          node tests/storage-lock-native.cjs
          node tests/knowledge-regression.cjs
          node tests/memento-regression.cjs
          node tests/global-search-core.cjs
          if [ "${{ needs.plan.outputs.tier }}" = "high" ]; then
            node tests/app-review-core.cjs
            node tests/dictation-regression.cjs
            node tests/journal-selfcare-core.cjs
            node tests/memento-category-integrity.cjs
            node tests/knowledge-covers.cjs
            node tests/pin-forest-regression.cjs
            node tests/masterplan-core.cjs
            node tests/knowledge-v2-core.cjs
            node tests/knowledge-v2-safety.cjs
            node tests/journal-upgrade-core.cjs
            node tests/fitness-regression.cjs
            node tests/trash-regression.cjs
            node tests/pin-disabled-regression.cjs
            node tests/illustrative-icons-core.cjs
          fi

  browser:
    needs: plan
    if: needs.plan.outputs.groups != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Cache Chromium binary
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.62.1-v1
      - name: Install browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/memento-browser" --no-package-lock --no-save playwright@1.62.1 @axe-core/playwright@4.11.1
          if [ "${{ steps.chromium-cache.outputs.cache-hit }}" = "true" ]; then
            "$RUNNER_TEMP/memento-browser/node_modules/.bin/playwright" install chromium
          else
            "$RUNNER_TEMP/memento-browser/node_modules/.bin/playwright" install --with-deps chromium
          fi
          echo "NODE_PATH=$RUNNER_TEMP/memento-browser/node_modules" >> "$GITHUB_ENV"
      - name: Run relevant actual browser journeys
        env:
          MEMENTO_CI_TIER: ${{ needs.plan.outputs.tier }}
        run: node tests/ci-groups.cjs '${{ matrix.group }}' "$MEMENTO_CI_TIER"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: memento-ci-${{ matrix.group }}
          path: /tmp/memento-*
          retention-days: 7

      - name: Keep Mijn dag design evidence on success and failure
        uses: actions/upload-artifact@v4
        if: always() && (matrix.group == 'interface-feature' || matrix.group == 'interface-day' || matrix.group == 'test-day-v3-browser')
        with:
          name: memento-day-v3-${{ matrix.group }}
          path: /tmp/memento-day-v3
          if-no-files-found: error
          retention-days: 7

  upgrade:
    needs: plan
    if: needs.plan.outputs.upgrade == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/memento-browser" --no-package-lock --no-save playwright@1.62.1
          "$RUNNER_TEMP/memento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/memento-browser/node_modules" >> "$GITHUB_ENV"
      - name: Preserve current data and attachments during the next upgrade
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE="$PR_BASE_SHA"
          if [ -z "$BASE" ]; then BASE="$(git rev-parse HEAD^)"; fi
          git fetch --depth=1 origin "$BASE"
          mkdir -p "$RUNNER_TEMP/memento-current-baseline"
          git archive "$BASE" | tar -x -C "$RUNNER_TEMP/memento-current-baseline"
          MEMENTO_RECOVERY_BASELINE_ROOT="$RUNNER_TEMP/memento-current-baseline" \
            MEMENTO_RECOVERY_BASELINE_SHA="$BASE" \
            node tests/recovery-upgrade-browser.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: memento-current-upgrade
          path: /tmp/memento-recovery-upgrade
          retention-days: 7

  release-gate:
    name: Memento release gate
    if: always()
    needs: [plan, core, browser, upgrade]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job to pass
        env:
          MEMENTO_GATE_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.MEMENTO_GATE_RESULTS);const failures=Object.entries(jobs).filter(([,j])=>!["success","skipped"].includes(j.result));if(jobs.plan.result!=="success"||failures.length){console.error("Memento CI blocked",JSON.stringify(failures));process.exit(1)}console.log("All selected Memento checks passed")'

