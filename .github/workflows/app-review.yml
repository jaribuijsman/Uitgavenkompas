name: Memento complete glass review
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/app-glass-review, 'fix/memento-*']
    paths: ['index.html', 'sw.js', 'assets/**', 'tests/**', '.github/workflows/app-review.yml']
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Existing storage, finance, knowledge, fitness and new review contracts
        run: |
          node tests/app-review-core.cjs
          node tests/dictation-regression.cjs
          node tests/journal-selfcare-core.cjs
          node tests/memento-category-integrity.cjs
          node tests/knowledge-covers.cjs
          node tests/pin-forest-regression.cjs
          node tests/memento-regression.cjs
          node tests/masterplan-core.cjs
          node tests/storage-safety.cjs
          node tests/storage-lock-native.cjs
          node tests/service-worker-cache.cjs
          node tests/knowledge-regression.cjs
          node tests/knowledge-v2-core.cjs
          node tests/knowledge-v2-safety.cjs
          node tests/journal-upgrade-core.cjs
          node tests/fitness-regression.cjs
          node tests/trash-regression.cjs
          node tests/pin-disabled-regression.cjs
          node tests/illustrative-icons-core.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        suite: [layout-completion-browser, visual-layout-browser, patches-001-002-004-browser, app-review-browser, masterplan-browser, storage-safety-browser, memento-category-browser, fitness-browser, knowledge-v2-browser, knowledge-covers-browser, notes-direction-c-browser, illustrative-icons-browser, quickfit-browser, journal-upgrade-browser, journal-selfcare-browser, memento-start-browser, visual-browser, recovery-browser, calendar-header-browser, release-acceptance-browser, glass-rendering-browser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Pinned browser tooling outside app source
        run: |
          npm install --prefix "$RUNNER_TEMP/memento-browser" --no-package-lock --no-save playwright@1.62.1 @axe-core/playwright@4.11.1
          "$RUNNER_TEMP/memento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/memento-browser/node_modules" >> "$GITHUB_ENV"
      - name: Actual mobile browser suite
        run: |
          if [ "${{ matrix.suite }}" = "visual-browser" ]; then
            node tests/helpers/visual-fixture.cjs > "$RUNNER_TEMP/glass-fixture.json"
            for width in 360 393 412 1280; do
              MEMENTO_VISUAL_FIXTURE="$RUNNER_TEMP/glass-fixture.json" MEMENTO_VISUAL_WIDTH="$width" node tests/visual-browser.cjs
            done
          elif [ "${{ matrix.suite }}" = "knowledge-v2-browser" ]; then
            node tests/helpers/visual-fixture.cjs > "$RUNNER_TEMP/glass-fixture.json"
            MEMENTO_VISUAL_FIXTURE="$RUNNER_TEMP/glass-fixture.json" node tests/knowledge-v2-browser.cjs
          else
            node tests/${{ matrix.suite }}.cjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glass-${{ matrix.suite }}
          path: /tmp/memento-*

  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Browser tooling and immutable original version
        run: |
          npm install --prefix "$RUNNER_TEMP/memento-browser" --no-package-lock --no-save playwright@1.62.1 @axe-core/playwright@4.11.1
          "$RUNNER_TEMP/memento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/memento-browser/node_modules" >> "$GITHUB_ENV"
          git fetch --depth=1 origin 52ac8c2f120b97769e26a8fb7f2ec1735ea7c0c9
          mkdir -p "$RUNNER_TEMP/memento-baseline"
          git archive 52ac8c2f120b97769e26a8fb7f2ec1735ea7c0c9 | tar -x -C "$RUNNER_TEMP/memento-baseline"
          echo "MEMENTO_BASELINE_ROOT=$RUNNER_TEMP/memento-baseline" >> "$GITHUB_ENV"
      - name: Existing data and binary attachments survive actual PWA upgrade
        run: |
          node tests/masterplan-journeys.cjs
          git fetch --depth=1 origin bf81413d6dc35fc097deeeb61c3eb09acf11834e
          mkdir -p "$RUNNER_TEMP/memento-recovery-baseline"
          git archive bf81413d6dc35fc097deeeb61c3eb09acf11834e | tar -x -C "$RUNNER_TEMP/memento-recovery-baseline"
          MEMENTO_RECOVERY_BASELINE_ROOT="$RUNNER_TEMP/memento-recovery-baseline" node tests/recovery-upgrade-browser.cjs
          git fetch --depth=1 origin 7503b542d9f37bdf059a552397b666d7e008eef2
          mkdir -p "$RUNNER_TEMP/memento-v71-baseline"
          git archive 7503b542d9f37bdf059a552397b666d7e008eef2 | tar -x -C "$RUNNER_TEMP/memento-v71-baseline"
          MEMENTO_RECOVERY_BASELINE_ROOT="$RUNNER_TEMP/memento-v71-baseline" MEMENTO_RECOVERY_BASELINE_SHA=7503b542d9f37bdf059a552397b666d7e008eef2 MEMENTO_RECOVERY_UPGRADE_OUT=/tmp/memento-v71-upgrade node tests/recovery-upgrade-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glass-upgrade
          path: |
            /tmp/memento-journeys
            /tmp/memento-recovery-upgrade
            /tmp/memento-v71-upgrade

  release-gate:
    name: Memento release gate
    if: always()
    needs: [core, browser, upgrade]
    runs-on: ubuntu-latest
    steps:
      - name: Require every core, browser and upgrade job to pass
        env:
          MEMENTO_GATE_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const results=JSON.parse(process.env.MEMENTO_GATE_RESULTS); const failed=Object.entries(results).filter(([,job])=>job.result!=="success"); if(failed.length){console.error(JSON.stringify(failed));process.exit(1);} console.log("All Memento acceptance jobs passed.");'
