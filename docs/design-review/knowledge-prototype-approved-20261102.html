const starter={title:'Projectbespreking: voortgang en actiepunten',kind:'Notitie',url:'',recipeStatus:'concept',ingredients:'',recipeNotes:'',folder:'Projecten & onderzoek',body:'Besproken tijdens het overleg:\n• De voortgang van het bestaande project.\n• Openstaande vragen en aandachtspunten.\n\nResultaat van de bespreking:\n[Vul hier het ontvangen antwoord in.]\n\nVervolg:\n[Wat wil ik later nog oppakken?]',tags:['project','acties'],pinned:false,archived:false,deleted:false,linkedFolders:[],links:[],files:[],source:'Projectoverleg: afspraken en planning',activities:[]};
let note=structuredClone(starter),committed=structuredClone(starter),screen='editor',sheetName='',selectedPassage='',selectedAction='',toastTimer,returnFocus=null,versions=[{date:'31 okt 2026',title:'Oorspronkelijke notitie',body:'Voorbeeld van een eerdere versie. In de echte app blijven bestaande revisies behouden.'}];
const main=document.getElementById('main'),overlay=document.getElementById('overlay'),sheetBody=document.getElementById('sheetBody');
function dirty(){return JSON.stringify(note)!==JSON.stringify(committed)}
function statusHTML(){return `<div class="save-state"><span class="status-dot ${dirty()?'':'saved'}"></span><span>${dirty()?'Niet opgeslagen wijzigingen':'Voorbeeld bewaard · lokaal in deze pagina'}</span></div>`}
function render(){if(screen==='editor')renderEditor();else if(screen==='preview')renderPreview();else renderHub();}
function renderEditor(){main.innerHTML=`
 <div class="eyebrow">Leven ${icon('right')} <strong>Notities</strong> ${icon('right')} Kenniscentrum</div>
 <header class="editor-head" aria-label="Kennisitem bewerken"><button class="icon-btn" data-action="back" aria-label="Terug naar notities">${icon('back')}</button><span class="head-title">Kennisitem bewerken</span><button class="icon-btn" data-action="menu" aria-label="Meer kennisitemacties">${icon('more')}</button><button class="save-btn" data-action="save">Opslaan</button></header>
 ${statusHTML()}
 <section class="panel" aria-label="Notitie schrijven">
 <div class="field-group"><label class="field-label" for="title">Titel</label><input class="field title-input" id="title" maxlength="180" value="${clean(note.title)}"></div>
 <div class="meta-two"><div class="field-group"><label class="field-label" for="kind">Type</label><select class="field" id="kind">${['Notitie','Link','Recept','Checklist'].map(v=>`<option ${note.kind===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field-group"><label class="field-label" for="folder">Verzameling</label><select class="field" id="folder">${['Inbox','Projecten & onderzoek','Levenspad','Projecten & onderzoek','Ideeën & inspiratie','Huis & wonen'].map(v=>`<option ${note.folder===v?'selected':''}>${v}</option>`).join('')}</select></div></div>
 ${note.kind==='Link'?`<div class="field-group"><label class="field-label" for="url">Website</label><input class="field" id="url" type="url" placeholder="https://…" value="${clean(note.url)}"></div>`:''}
 <label class="field-label" for="body">Inhoud</label><div class="editor-pane"><div class="format-bar" role="toolbar" aria-label="Tekst bewerken"><button type="button" data-action="format" data-format="heading" title="Kop">H1</button><button type="button" data-action="format" data-format="bold" title="Vet"><strong>Vet</strong></button><button type="button" data-action="format" data-format="list" title="Lijst">☷ Lijst</button><button type="button" data-action="format" data-format="link" title="Link">${icon('link')} Link</button><button type="button" class="text-task" data-action="selected-task">${icon('task')} Taak</button></div><textarea id="body" class="text-area" placeholder="Schrijf je notitie…">${clean(note.body)}</textarea></div>
 <div class="helper-bar"><span class="helper">Selecteer tekst en kies Taak om die te verwerken.</span><button class="soft-link" type="button" data-action="preview">Voorbeeld</button></div>
 ${note.kind==='Recept'?`<div style="border-top:1px solid var(--stroke);margin-top:13px;padding-top:13px"><h2>Receptgegevens</h2><div class="field-group"><label class="field-label" for="recipeStatus">Status</label><select class="field" id="recipeStatus">${['concept','testen','definitief'].map(x=>`<option ${x===note.recipeStatus?'selected':''}>${x}</option>`).join('')}</select></div><div class="field-group"><label class="field-label" for="ingredients">Ingrediënten (één per regel)</label><textarea class="field" id="ingredients" rows="4" placeholder="Ingrediënt | hoeveelheid | eenheid">${clean(note.ingredients)}</textarea></div><div class="field-group"><label class="field-label" for="recipeNotes">Testnotities</label><textarea class="field" id="recipeNotes" rows="2">${clean(note.recipeNotes)}</textarea></div></div>`:''}
 ${note.kind==='Checklist'?'<p class="helper" style="margin-top:12px">Gebruik regels met - [ ] voor open en - [x] voor afgeronde onderdelen; de echte checklisteditor behoudt bestaande item-ID’s.</p>':''}
 </section>
 <section class="panel" aria-label="Organiseren"><div class="section-title"><span class="icon-inline">${icon('folder')}</span><div class="copy"><h2>Organiseren</h2><p>Waar hoort deze notitie thuis?</p></div></div>
 <div class="compact-line"><span class="line-label">Verzameling</span><span class="line-value" id="folderSummary">${clean(note.folder)}</span><button class="line-btn" data-action="choose-folder" aria-label="Verzameling wijzigen">${icon('right')}</button></div>
 <div class="compact-line"><span class="line-label">Labels</span><span class="line-value"><span class="chip-row" id="tagSummary">${note.tags.map(t=>`<span class="chip">#${clean(t)}</span>`).join('')||'Geen labels'}</span></span><button class="line-btn" data-action="tags" aria-label="Labels beheren">${icon('right')}</button></div>
 <button type="button" class="management-link" data-action="folders">${icon('folder')} Ook tonen in andere mappen <span class="muted">${note.linkedFolders.length?note.linkedFolders.length+' gekoppeld':'Optioneel'}</span>${icon('right')}</button>
 </section>
 <section class="panel" aria-label="Opvolging en koppelingen"><div class="section-title"><span class="icon-inline">${icon('branch')}</span><div class="copy"><h2>Opvolging & koppelingen</h2><p>Maak een vervolg zonder informatie kwijt te raken.</p></div></div>
 <div class="related"><span class="icon-inline">${icon('calendar')}</span><div><strong>Bron: ${clean(note.source)}</strong><small>De oorspronkelijke afspraak blijft apart bestaan.</small></div></div>
 ${note.activities.length?`<div class="sheet-section" style="margin:13px 0 4px">VERVOLGACTIES</div>${note.activities.map(a=>`<div class="compact-line"><span class="icon-inline">${icon(a.kind==='Taak'?'task':a.kind==='Afspraak'?'calendar':'file')}</span><span class="line-value">${clean(a.kind)}: ${clean(a.title)}</span></div>`).join('')}`:''}
 ${note.links.length?`<div class="helper" style="margin:7px 0">Verbonden: ${note.links.map(clean).join(', ')}</div>`:''}
 <div class="row-actions"><button class="primary" type="button" data-action="followup">${icon('plus')} Nieuw vervolg</button><button type="button" class="secondary more-inline" aria-label="Koppelingen en vervolgacties" data-action="relations">${icon('more')}</button></div>
 </section>
 <section class="panel" style="padding:12px 16px" aria-label="Extra mogelijkheden"><button class="management-link" data-action="attachments">${icon('paperclip')} Bijlagen <span class="muted">${note.files.length?note.files.length+' bestand(en)':'Toevoegen'}</span>${icon('right')}</button><button class="management-link" data-action="menu">${icon('more')} Alle overige acties <span class="muted">Beheer en historie</span>${icon('right')}</button></section>
 <div class="footer-space"></div>`;
}
function renderHub(){const which=screen==='folders'?'Mappen':screen==='notes'?'Notities':'Overzicht';main.innerHTML=`<div class="page-head"><div><h1>Kenniscentrum</h1><p>Jouw notities en verzamelingen</p></div><button class="icon-btn" data-action="editor" aria-label="Notitie openen">${icon('edit')}</button></div><div class="tabs">${[['overview','Overzicht'],['folders','Mappen'],['notes','Notities']].map(([id,label])=>`<button data-action="hub" data-id="${id}" class="${id===screen?'active':''}">${label}</button>`).join('')}</div><h2 style="font-size:16px;margin:16px 4px">${which}</h2>${screen==='folders'?`<button class="list-card" data-action="editor">${icon('folder')}<span class="list-main"><strong>Gezondheid</strong><small>Open de notitie in deze verzameling</small></span><span>›</span></button><button class="list-card" data-action="editor">${icon('folder')}<span class="list-main"><strong>Projecten & onderzoek</strong><small>Verzamelingen en onderwerpen</small></span><span>›</span></button>`:`<button class="list-card" data-action="editor">${icon('file')}<span class="list-main"><strong>${clean(note.title)}</strong><small>${clean(note.folder)} · ${note.deleted?'Prullenbak':note.archived?'Gearchiveerd':'Bewerken of opvolgen'}</small></span><span>›</span></button>`}${note.deleted?'<button class="secondary" data-action="restore-note">Herstellen uit prullenbak</button>':''}<p class="helper" style="margin:18px 4px">Dit is een beperkte navigatievoorvertoning. Het ontwerp richt zich op de complete kennisitem-editor.</p>`;}
function renderPreview(){main.innerHTML=`<div class="eyebrow">Notities ${icon('right')} Voorbeeld</div><header class="editor-head"><button class="icon-btn" data-action="editor" aria-label="Terug">${icon('back')}</button><span class="head-title">Voorbeeld</span><button class="save-btn" data-action="editor">Bewerken</button></header><section class="panel"><p class="helper">${clean(note.folder)} · ${clean(note.kind)} · ${note.tags.map(x=>'#'+clean(x)).join(' ')}</p><h2 style="font-size:22px;margin:12px 0">${clean(note.title)}</h2><div class="preview-content" style="max-height:none">${clean(note.body)}</div>${note.files.length?`<p class="helper" style="margin:9px 0">Bijlagen: ${note.files.map(f=>clean(f.name)).join(', ')}</p>`:''}</section>`;}
function updateUI(){const status=main.querySelector('.save-state');if(status)status.outerHTML=statusHTML()}
function setNoteProp(prop,value){note[prop]=value;updateUI()}
function showToast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3200)}
function closeSheet(){overlay.classList.add('hidden');sheetName='';sheetBody.innerHTML='';document.body.style.overflow='';if(returnFocus?.isConnected)returnFocus.focus()}
function openSheet(name,html){returnFocus=document.activeElement;sheetName=name;sheetBody.innerHTML=`<div class="sheet-title"><h2>${clean(name)}</h2><button class="icon-btn" data-action="close" aria-label="Sluiten">${icon('close')}</button></div>${html}`;overlay.classList.remove('hidden');document.body.style.overflow='hidden';requestAnimationFrame(()=>sheetBody.querySelector('button,select,input,textarea')?.focus({preventScroll:true}))}
function item(iconName,label,action,description='',danger=false){return `<button class="sheet-item ${danger?'danger':''}" data-action="${action}">${icon(iconName)}<span>${label}${description?`<small>${description}</small>`:''}</span>${icon('right')}</button>`}
function sheetMenu(){openSheet('Meer acties',`<div class="sheet-section">Notitie</div>${item('pin',note.pinned?'Losmaken':'Vastzetten','pin','Toon in Vastgezet')}${item('archive',note.archived?'Terug uit archief':'Archiveren','archive','Behouden buiten actieve overzichten')}<div class="sheet-section">Weergave en geschiedenis</div>${item('eye','Voorbeeld','preview')}${item('clock','Versiegeschiedenis','versions','Eerdere tekstversies vergelijken')}<div class="sheet-section">Concept en gegevens</div>${item('undo','Concept verwerpen','discard','Niet-opgeslagen wijzigingen',true)}${item('trash','Notitie verwijderen','delete','Eerst bevestigen',true)}`)}
function sheetFollowup(){openSheet('Nieuw vervolg',`<p class="helper">De bronnotitie en de oorspronkelijke afspraak blijven bestaan. Kies wat je wilt maken.</p>${item('task','Vervolgtaak','follow-task','Een concrete actie om later af te ronden')}${item('calendar','Vervolgafspraak','follow-appointment','Een nieuw moment met datum of tijd')}${item('file','Vervolgnotitie','follow-note','Schrijf verder in een aparte notitie')}`)}
function sheetRelations(){openSheet('Koppelingen',`<div class="sheet-section">Verbonden afspraak</div><div class="related">${icon('calendar')}<div><strong>${clean(note.source)}</strong><small>Oorspronkelijk gegeven niet wijzigen</small></div></div><div class="sheet-section">Andere relaties</div>${item('link','Notitie koppelen','link-note','Voeg een verwijzing toe, geen kopie')}${item('folder','Mappen koppelen','folders','Ook bereikbaar vanuit een extra map')}${item('task','Taak uit geselecteerde tekst','selected-task','Selecteer tekst in de editor')}${item('edit','Passage handmatig invoeren','manual-passage','Maak een taakvoorstel van een ingevoerde passage')}`)}
function sheetFolders(){const choices=['Projecten & onderzoek','Levenspad','Projecten & onderzoek','Huis & wonen','Ideeën & inspiratie'];openSheet('Mappen koppelen',`<p class="helper">Dit is niet hetzelfde als de hoofdverzameling wijzigen. De notitie blijft in ${clean(note.folder)} staan en is ook bereikbaar via gekozen mappen.</p>${choices.filter(x=>x!==note.folder).map(x=>`<label class="sheet-item"><input type="checkbox" data-linked-folder="${clean(x)}" ${note.linkedFolders.includes(x)?'checked':''} style="width:22px;height:22px;accent-color:#c6dfbe"><span>${clean(x)}</span></label>`).join('')}<button class="primary" data-action="confirm-folders">Koppelingen toepassen</button>`)}
function sheetTags(){openSheet('Labels beheren',`<p class="helper">Labels helpen bij zoeken en terugvinden. Pas voorgestelde labels aan of voeg eigen labels toe.</p><label class="field-label" for="tagsInput">Labels, gescheiden door komma’s</label><input class="field" id="tagsInput" value="${clean(note.tags.join(', '))}" maxlength="1000"><button class="primary" data-action="confirm-tags">Labels toepassen</button>`)}
function sheetChooseFolder(){openSheet('Verzameling kiezen',`<p class="helper">Kies de hoofdverzameling van dit item. Extra gekoppelde mappen blijven apart.</p>${['Inbox','Projecten & onderzoek','Levenspad','Projecten & onderzoek','Ideeën & inspiratie','Huis & wonen'].map(x=>`<button class="sheet-item" data-action="set-folder" data-name="${clean(x)}">${icon('folder')}<span>${clean(x)}</span>${note.folder===x?icon('check'):icon('right')}</button>`).join('')}`)}
function sheetAttachments(){openSheet('Bijlagen',`<p class="helper">In echte Memento blijven PDF’s en afbeeldingen lokaal en gaan ze mee in de volledige ZIP-back-up. In dit prototype zijn bestandsselecties alleen tijdelijk zichtbaar.</p>${note.files.map(f=>`<div class="compact-line">${icon('paperclip')}<span class="line-value">${clean(f.name)} · ${Math.ceil(f.size/1024)} kB</span></div>`).join('')}<label class="field-label" for="fileInput">PDF of afbeelding toevoegen</label><input class="field" id="fileInput" type="file" accept=".pdf,image/png,image/jpeg,image/webp" multiple><p class="helper">Maximaal 25 MB per bestand (zoals in Memento).</p><button class="primary" data-action="confirm-attachments">Bijlagen toevoegen</button>`)}
function sheetVersions(){openSheet('Versiegeschiedenis',`<p class="helper">Een herstel moet een nieuwe revisie maken. Het huidige document mag niet ongemerkt overschreven worden.</p>${versions.map((v,i)=>`<button class="sheet-item" data-action="version-open" data-index="${i}">${icon('clock')}<span>${clean(v.title)}<small>${clean(v.date)}</small></span>${icon('right')}</button>`).join('')}`)}
function sheetVersion(i){const v=versions[i];openSheet('Eerdere versie',`<p class="helper">${clean(v.date)} · ${clean(v.title)}</p><div class="preview-content">${clean(v.body)}</div><button class="secondary" data-action="versions">Terug naar geschiedenis</button><button class="primary" data-action="version-restore" data-index="${i}">Herstellen als nieuwe bewerking</button>`)}
function sheetConfirm(type){const cfg=type==='delete'?['Notitie verwijderen','Dit verwijdert in dit prototype het voorbeelditem uit het actieve overzicht. In de echte Memento moet de prullenbak en herstelroute intact blijven.','Notitie in prullenbak plaatsen']:type==='discard'?['Concept verwerpen','Alle wijzigingen sinds de laatste opslag van dit voorbeeld gaan verloren.','Wijzigingen verwerpen']:['Editor verlaten','Je hebt niet-opgeslagen wijzigingen. Wat wil je doen?','Wijzigingen verwerpen en terug'];openSheet(cfg[0],`<p class="modal-copy">${clean(cfg[1])}</p><button class="secondary" data-action="close">Annuleren</button>${type==='back'?'<button class="primary" data-action="save-back">Opslaan en terug</button>':''}<button class="secondary danger" data-action="confirm-${type}">${clean(cfg[2])}</button>`)}
function sheetManualPassage(){openSheet('Passage invoeren',`<p class="helper">Neem een passage over of typ hem zelf. De brontekst blijft staan.</p><label class="field-label" for="manualPassage">Passage</label><textarea class="field" rows="4" id="manualPassage" maxlength="2500" placeholder="Welke actie moet hieruit ontstaan?"></textarea><button class="primary" data-action="confirm-manual-passage">Taakvoorstel controleren</button>`)}
function sheetSelectedTask(){const textArea=main.querySelector('#body');let chosen='';if(textArea){chosen=textArea.value.substring(textArea.selectionStart,textArea.selectionEnd).trim()}if(!chosen){showToast('Selecteer eerst een stukje tekst in de notitie.');textArea?.focus();return}selectedPassage=chosen;selectedAction='Taak';openSheet('Taak uit selectie',`<p class="helper">De selectie wordt overgenomen; de oorspronkelijke tekst blijft behouden.</p><div class="preview-content">${clean(chosen)}</div><button class="primary" data-action="confirm-follow">Voorbeeldtaak toevoegen</button>`)}
function sheetNewActivity(kind){selectedAction=kind;selectedPassage='';openSheet('Nieuw'+(kind==='Notitie'?'e':kind==='Afspraak'?'e':'')+' '+kind.toLowerCase(),`<p class="helper">De oorspronkelijke kennisnotitie en bronafspraak blijven behouden. Er wordt alleen een gekoppeld vervolgvoorbeeld gemaakt.</p><label class="field-label" for="actTitle">Titel</label><input class="field" id="actTitle" maxlength="180" value="${clean(kind==='Taak'?'Projectafspraak opvolgen':kind==='Afspraak'?'Vervolg overleg':'Vervolg projectoverleg')}">${kind==='Afspraak'?'<label class="field-label" for="actDate">Datum (optioneel)</label><input class="field" type="date" id="actDate">':''}<button class="primary" data-action="confirm-follow">Vervolg toevoegen</button>`)}
function doSave(){if(!note.title.trim()){showToast('Vul eerst een titel in.');main.querySelector('#title')?.focus();return false}if(dirty()){versions.unshift({date:'Deze sessie',title:'Bewaarde versie van voorbeeld',body:committed.body});committed=structuredClone(note)}updateUI();showToast('Bewaard in het prototype, niet in Memento.');return true}
function navigateBack(){if(dirty())sheetConfirm('back');else{screen='notes';render();window.scrollTo(0,0)}}
function addFollow(){const title=(document.getElementById('actTitle')?.value||selectedPassage.slice(0,80)||'Vervolgtaak').trim();if(!title){showToast('Vul een titel in.');return}const date=document.getElementById('actDate')?.value;note.activities.push({kind:selectedAction,title:title+(date?' · '+date:'')});closeSheet();screen='editor';render();showToast('Vervolg toegevoegd aan dit voorbeeld.')}
function insertText(mode){const el=document.getElementById('body');if(!el)return;const s=el.selectionStart,e=el.selectionEnd,text=el.value,part=text.slice(s,e);let ins=mode==='heading'?'# '+(part||'Kop'):mode==='bold'?'**'+(part||'tekst')+'**':mode==='list'?'- '+(part||'Onderdeel'):'['+(part||'tekst')+'](https://)';el.value=text.slice(0,s)+ins+text.slice(e);el.focus();el.setSelectionRange(s+ins.length,s+ins.length);note.body=el.value;updateUI()}
main.addEventListener('input',e=>{if(e.target.id==='title')setNoteProp('title',e.target.value);if(e.target.id==='body')setNoteProp('body',e.target.value);if(['url','ingredients','recipeNotes'].includes(e.target.id))setNoteProp(e.target.id,e.target.value)});
main.addEventListener('change',e=>{if(e.target.id==='kind'){setNoteProp('kind',e.target.value);render()}if(e.target.id==='recipeStatus')setNoteProp('recipeStatus',e.target.value);if(e.target.id==='folder'){setNoteProp('folder',e.target.value);render()}});
function handle(action,el){switch(action){case'close':closeSheet();return;case'editor':closeSheet();screen='editor';render();window.scrollTo(0,0);return;case'notes':closeSheet();if(screen==='editor'){navigateBack();return}screen='notes';render();window.scrollTo(0,0);return;case'back':navigateBack();return;case'hub':screen=el.dataset.id;render();return;case'save':doSave();return;case'preview':closeSheet();screen='preview';render();window.scrollTo(0,0);return;case'menu':sheetMenu();return;case'followup':sheetFollowup();return;case'relations':sheetRelations();return;case'choose-folder':sheetChooseFolder();return;case'folders':sheetFolders();return;case'tags':sheetTags();return;case'attachments':sheetAttachments();return;case'format':insertText(el.dataset.format);return;case'selected-task':closeSheet();sheetSelectedTask();return;case'manual-passage':sheetManualPassage();return;case'confirm-manual-passage':{const v=(document.getElementById('manualPassage')?.value||'').trim();if(!v){showToast('Vul een passage in.');return}selectedPassage=v;selectedAction='Taak';openSheet('Taakvoorstel',`<p class="helper">Controleer het voorstel vóór toevoegen.</p><div class="preview-content">${clean(v)}</div><button class="primary" data-action="confirm-follow">Voorbeeldtaak toevoegen</button>`);return}case'pin':note.pinned=!note.pinned;closeSheet();render();showToast(note.pinned?'Vastgezet in dit voorbeeld.':'Losgemaakt in dit voorbeeld.');return;case'archive':note.archived=!note.archived;closeSheet();render();showToast(note.archived?'Gearchiveerd in dit voorbeeld.':'Teruggezet uit archief.');return;case'versions':sheetVersions();return;case'version-open':sheetVersion(Number(el.dataset.index));return;case'version-restore':note.body=versions[Number(el.dataset.index)].body;closeSheet();render();showToast('Versie ingevuld als niet-opgeslagen wijziging.');return;case'discard':sheetConfirm('discard');return;case'delete':sheetConfirm('delete');return;case'confirm-discard':note=structuredClone(committed);closeSheet();render();showToast('Concept hersteld naar het laatst bewaarde voorbeeld.');return;case'confirm-delete':note.deleted=true;closeSheet();screen='notes';render();showToast('Simulatie: item in prullenbak. Geen Memento-gegevens gewijzigd.');return;case'restore-note':note.deleted=false;render();showToast('Notitie hersteld uit voorbeeldprullenbak.');return;case'confirm-back':note=structuredClone(committed);closeSheet();screen='notes';render();window.scrollTo(0,0);return;case'save-back':if(doSave()){closeSheet();screen='notes';render();window.scrollTo(0,0)}return;case'follow-task':closeSheet();sheetNewActivity('Taak');return;case'follow-appointment':closeSheet();sheetNewActivity('Afspraak');return;case'follow-note':closeSheet();sheetNewActivity('Notitie');return;case'confirm-follow':addFollow();return;case'set-folder':note.folder=el.dataset.name;closeSheet();render();return;case'confirm-folders':note.linkedFolders=[...sheetBody.querySelectorAll('[data-linked-folder]:checked')].map(x=>x.dataset.linkedFolder);closeSheet();render();return;case'confirm-tags':note.tags=(document.getElementById('tagsInput')?.value||'').split(',').map(x=>x.trim().replace(/^#/, '')).filter(Boolean).slice(0,15);closeSheet();render();return;case'confirm-attachments':{const files=[...(document.getElementById('fileInput')?.files||[])];if(!files.length){showToast('Kies eerst een bestand.');return}if(files.some(f=>f.size>25*1024*1024)){showToast('Een bestand is groter dan 25 MB.');return}note.files.push(...files.map(f=>({name:f.name,size:f.size})));closeSheet();render();showToast('Bestandsnamen toegevoegd; geen bestanden opgeslagen.');return}case'link-note':openSheet('Notitie koppelen',`<p class="helper">Een koppeling verwijst naar een bestaande notitie; dupliceren is niet nodig.</p>${['Projectoverleg · eerdere afspraak','Projecten · onderzoek'].map(x=>`<button class="sheet-item" data-action="confirm-link" data-name="${clean(x)}">${icon('link')}<span>${clean(x)}</span>${icon('right')}</button>`).join('')}`);return;case'confirm-link':{const x=el.dataset.name;if(!note.links.includes(x))note.links.push(x);closeSheet();render();showToast('Voorbeeldkoppeling toegevoegd.');return}case'global-menu':openSheet('Memento · Meer',`${item('folder','Notities en mappen','hub-notes')}${item('info','Over dit prototype','about')}`);return;case'hub-notes':closeSheet();screen='overview';render();window.scrollTo(0,0);return;case'about':openSheet('Over het ontwerp',`<p class="modal-copy">Dit prototype gebruikt de bestaande Memento-hiërarchie, bosgroene materialen, saliekleurige hoofdacties en de kennisfuncties uit de actuele GitHub-main. De schermen en acties zijn heringedeeld, niet geïmplementeerd. Er is geen verbinding met je echte opslag, GitHub of agenda.</p><button class="secondary" data-action="close">Sluiten</button>`);return;case'life':showToast('Je bekijkt het onderdeel Leven.');return;case'finance':showToast('Financiën blijft buiten dit editorprototype.');return;case'outside':showToast(el.dataset.name+' bestaat in Memento; dit prototype richt zich op Notities.');return;default:showToast('Geen actie gekoppeld: '+action)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)handle(b.dataset.action,b);});overlay.addEventListener('click',e=>{if(e.target===overlay)closeSheet()});document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='BrowserBack'){if(!overlay.classList.contains('hidden')){e.preventDefault();closeSheet()}else if(screen==='preview'){screen='editor';render()}else if(screen==='editor'){navigateBack()}}});window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});
render();
</script>
